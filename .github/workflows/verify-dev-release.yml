name: Verify Dev release end-to-end

"on":
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Expected store-front image tag to verify"
        required: true
        default: "stage18-secure-flow-v3"

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  validate-verification-input:
    name: Validate Verification Input
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.validate.outputs.image_tag }}
      image_ref: ${{ steps.validate.outputs.image_ref }}

    steps:
      - name: Validate expected image tag
        id: validate
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ github.event.inputs.image_tag }}"

          if [[ -z "${IMAGE_TAG}" ]]; then
            echo "image_tag cannot be empty"
            exit 1
          fi

          if [[ ! "${IMAGE_TAG}" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "image_tag contains invalid characters: ${IMAGE_TAG}"
            exit 1
          fi

          IMAGE_REF="${{ vars.ACR_LOGIN_SERVER }}/store-front:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

          echo "Verification input is valid"
          echo "Expected image tag: ${IMAGE_TAG}"
          echo "Expected image ref: ${IMAGE_REF}"

  verify-acr-image:
    name: Verify ACR Image
    runs-on: ubuntu-latest
    needs:
      - validate-verification-input

    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify image tag exists in ACR
        run: |
          set -euo pipefail

          EXPECTED_TAG="${{ needs.validate-verification-input.outputs.image_tag }}"

          echo "Checking ACR image tag: ${EXPECTED_TAG}"

          az acr repository show-tags \
            --name "${{ vars.ACR_NAME }}" \
            --repository store-front \
            --output tsv | grep -Fx "${EXPECTED_TAG}"

          echo "ACR image tag exists: ${EXPECTED_TAG}"

  verify-gitops-desired-state:
    name: Verify GitOps Desired State
    runs-on: ubuntu-latest
    needs:
      - validate-verification-input
      - verify-acr-image

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          ref: ${{ vars.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Set up kubectl for Kustomize render
        uses: azure/setup-kubectl@v4

      - name: Verify GitOps Dev overlay image tag
        working-directory: gitops
        run: |
          set -euo pipefail

          EXPECTED_TAG="${{ needs.validate-verification-input.outputs.image_tag }}"
          EXPECTED_IMAGE="${{ needs.validate-verification-input.outputs.image_ref }}"
          FILE="${{ vars.GITOPS_STORE_FRONT_FILE }}"
          DEV_OVERLAY="apps/capstone-store/overlays/dev"

          echo "Expected tag: ${EXPECTED_TAG}"
          echo "Expected image: ${EXPECTED_IMAGE}"
          echo "GitOps file: ${FILE}"

          if [[ ! -f "${FILE}" ]]; then
            echo "GitOps file not found: ${FILE}"
            exit 1
          fi

          if grep -q "newTag:" "${FILE}"; then
            grep -n "newTag: ${EXPECTED_TAG}" "${FILE}"
          else
            grep -n "image: ${EXPECTED_IMAGE}" "${FILE}"
          fi

          echo "Rendering Dev overlay to verify final desired image..."
          kubectl kustomize "${DEV_OVERLAY}" > /tmp/dev-rendered.yaml

          grep -n "image: ${EXPECTED_IMAGE}" /tmp/dev-rendered.yaml
          grep -n "namespace: capstone-dev" /tmp/dev-rendered.yaml | head

          echo "GitOps desired state uses expected image."

  verify-gitops-validation-status:
    name: Verify GitOps Validation Status
    runs-on: ubuntu-latest
    needs:
      - verify-gitops-desired-state

    steps:
      - name: Verify latest GitOps validation workflow passed
        env:
          GH_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        run: |
          set -euo pipefail

          echo "Checking latest GitOps validation workflow run..."

          STATUS="$(gh run list \
            --repo "${{ vars.GITOPS_REPO }}" \
            --workflow "validate-gitops-manifests.yml" \
            --branch "${{ vars.GITOPS_BRANCH }}" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')"

          echo "Latest GitOps validation conclusion: ${STATUS}"

          test "${STATUS}" = "success"

          echo "Latest GitOps validation workflow passed."

  verify-argocd-health:
    name: Verify Argo CD Health
    runs-on: ubuntu-latest
    needs:
      - verify-gitops-validation-status

    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Get AKS credentials
        run: |
          set -euo pipefail

          az aks get-credentials \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Verify Argo CD application is synced and healthy
        run: |
          set -euo pipefail

          echo "Waiting for Argo CD application to become Synced and Healthy..."

          for i in $(seq 1 30); do
            kubectl get application "${{ vars.ARGOCD_APP_NAME }}" \
              -n "${{ vars.ARGOCD_NAMESPACE }}"

            SYNC_STATUS="$(kubectl get application "${{ vars.ARGOCD_APP_NAME }}" \
              -n "${{ vars.ARGOCD_NAMESPACE }}" \
              -o jsonpath='{.status.sync.status}')"

            HEALTH_STATUS="$(kubectl get application "${{ vars.ARGOCD_APP_NAME }}" \
              -n "${{ vars.ARGOCD_NAMESPACE }}" \
              -o jsonpath='{.status.health.status}')"

            echo "Attempt ${i}: sync=${SYNC_STATUS}, health=${HEALTH_STATUS}"

            if [[ "${SYNC_STATUS}" = "Synced" && "${HEALTH_STATUS}" = "Healthy" ]]; then
              echo "Argo CD application is Synced and Healthy."
              exit 0
            fi

            sleep 10
          done

          echo "Argo CD application did not become Synced and Healthy within timeout."
          exit 1

  verify-aks-deployment:
    name: Verify AKS Deployment
    runs-on: ubuntu-latest
    needs:
      - validate-verification-input
      - verify-argocd-health

    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Get AKS credentials
        run: |
          set -euo pipefail

          az aks get-credentials \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Verify AKS deployment image
        run: |
          set -euo pipefail

          EXPECTED_IMAGE="${{ needs.validate-verification-input.outputs.image_ref }}"

          ACTUAL_IMAGE="$(kubectl get deployment "${{ vars.APP_DEPLOYMENT }}" \
            -n "${{ vars.APP_NAMESPACE }}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')"

          echo "Expected image: ${EXPECTED_IMAGE}"
          echo "Actual image:   ${ACTUAL_IMAGE}"

          test "${ACTUAL_IMAGE}" = "${EXPECTED_IMAGE}"

      - name: Verify rollout and pod status
        run: |
          set -euo pipefail

          kubectl rollout status deployment/"${{ vars.APP_DEPLOYMENT }}" \
            -n "${{ vars.APP_NAMESPACE }}" \
            --timeout=120s

          kubectl get pods \
            -n "${{ vars.APP_NAMESPACE }}" \
            -l "${{ vars.APP_LABEL_SELECTOR }}" \
            -o wide

          READY_PODS="$(kubectl get pods \
            -n "${{ vars.APP_NAMESPACE }}" \
            -l "${{ vars.APP_LABEL_SELECTOR }}" \
            --field-selector=status.phase=Running \
            --no-headers | wc -l | tr -d ' ')"

          echo "Running pods: ${READY_PODS}"

          test "${READY_PODS}" -ge 1

  verify-gateway:
    name: Verify Gateway
    runs-on: ubuntu-latest
    needs:
      - verify-aks-deployment

    steps:
      - name: Verify Gateway HTTP response
        run: |
          set -euo pipefail

          echo "Testing Gateway URL: ${{ vars.GATEWAY_URL }}"

          HTTP_CODE="$(curl -sS -o /tmp/gateway-response.txt -w "%{http_code}" "${{ vars.GATEWAY_URL }}")"

          echo "Gateway HTTP code: ${HTTP_CODE}"

          test "${HTTP_CODE}" = "200"

  dev-release-verification-summary:
    name: Dev Release Verification Summary
    runs-on: ubuntu-latest
    needs:
      - validate-verification-input
      - verify-acr-image
      - verify-gitops-desired-state
      - verify-gitops-validation-status
      - verify-argocd-health
      - verify-aks-deployment
      - verify-gateway
    if: always()

    steps:
      - name: Write Dev release verification summary
        run: |
          {
            echo "# Dev Release Verification Summary"
            echo
            echo "| Gate | Result | Purpose |"
            echo "|---|---|---|"
            echo "| Validate Verification Input | ${{ needs.validate-verification-input.result }} | Validates expected image tag and image reference |"
            echo "| Verify ACR Image | ${{ needs.verify-acr-image.result }} | Confirms image tag exists in ACR |"
            echo "| Verify GitOps Desired State | ${{ needs.verify-gitops-desired-state.result }} | Confirms Dev overlay and rendered manifest use expected image |"
            echo "| Verify GitOps Validation Status | ${{ needs.verify-gitops-validation-status.result }} | Confirms latest GitOps validation workflow passed |"
            echo "| Verify Argo CD Health | ${{ needs.verify-argocd-health.result }} | Confirms Argo CD app is Synced and Healthy |"
            echo "| Verify AKS Deployment | ${{ needs.verify-aks-deployment.result }} | Confirms AKS deployment image, rollout, and pods |"
            echo "| Verify Gateway | ${{ needs.verify-gateway.result }} | Confirms Gateway returns HTTP 200 |"
            echo
            echo "Image: ${{ needs.validate-verification-input.outputs.image_ref }}"
            echo "GitOps repo: ${{ vars.GITOPS_REPO }}"
            echo "Argo CD app: ${{ vars.ARGOCD_APP_NAME }}"
            echo "Namespace: ${{ vars.APP_NAMESPACE }}"
            echo "Gateway: ${{ vars.GATEWAY_URL }}"
            echo
            echo "This workflow verifies the Dev release end-to-end. It does not deploy directly."
          } >> "$GITHUB_STEP_SUMMARY"
