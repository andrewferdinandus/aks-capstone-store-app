name: Build store-front and deploy Dev via GitOps

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build, push, and deploy to Dev"
        required: true
        default: "stage12-v1"

permissions:
  id-token: write
  contents: read

jobs:
  build-push-update-gitops:
    name: Build, push, and update GitOps Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push store-front image
        uses: docker/build-push-action@v6
        with:
          context: ./src/store-front
          push: true
          platforms: linux/amd64
          tags: ${{ vars.ACR_LOGIN_SERVER }}/store-front:${{ github.event.inputs.image_tag }}

      - name: Verify image tag in ACR
        run: |
          az acr repository show-tags \
            --name ${{ vars.ACR_NAME }} \
            --repository store-front \
            --output table

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          ref: ${{ vars.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Update Dev image tag in GitOps repo
        working-directory: gitops
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/store-front:${{ github.event.inputs.image_tag }}"
          FILE="${{ vars.GITOPS_STORE_FRONT_FILE }}"

          echo "Updating $FILE"
          echo "New image: $IMAGE"

          sed -i -E "s#image: .*/store-front:.*#image: ${IMAGE}#g" "$FILE"

          echo "Updated image line:"
          grep -n "image: .*store-front" "$FILE"

      - name: Commit and push GitOps change
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No GitOps changes to commit"
            exit 0
          fi

          git add "${{ vars.GITOPS_STORE_FRONT_FILE }}"
          git commit -m "Deploy store-front ${{ github.event.inputs.image_tag }} to dev"
          git push origin ${{ vars.GITOPS_BRANCH }}
