name: Build store-front and deploy Dev via GitOps

"on":
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build, scan, push, and deploy to Dev"
        required: true
        default: "stage13-v1"

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  validate-release-input:
    name: Validate Release Input
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.validate.outputs.image_tag }}
      image_ref: ${{ steps.validate.outputs.image_ref }}

    steps:
      - name: Validate image tag
        id: validate
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ github.event.inputs.image_tag }}"

          if [[ -z "${IMAGE_TAG}" ]]; then
            echo "image_tag cannot be empty"
            exit 1
          fi

          if [[ ! "${IMAGE_TAG}" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "image_tag contains invalid characters: ${IMAGE_TAG}"
            exit 1
          fi

          IMAGE_REF="${{ vars.ACR_LOGIN_SERVER }}/store-front:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

          echo "Release input is valid"
          echo "Image tag: ${IMAGE_TAG}"
          echo "Image ref: ${IMAGE_REF}"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs:
      - validate-release-input

    steps:
      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --redact --verbose --config=/repo/.gitleaks.toml

  source-security-scan:
    name: Source Security Scan
    runs-on: ubuntu-latest
    needs:
      - validate-release-input

    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Run Trivy filesystem and dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./src/store-front
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    needs:
      - validate-release-input
      - secret-scan
      - source-security-scan

    steps:
      - name: Checkout app source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build store-front image locally
        uses: docker/build-push-action@v6
        with:
          context: ./src/store-front
          push: false
          platforms: linux/amd64
          tags: ${{ needs.validate-release-input.outputs.image_ref }}
          outputs: type=docker,dest=/tmp/store-front-image.tar

      - name: Upload built image artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-front-image
          path: /tmp/store-front-image.tar
          retention-days: 1

  image-security-scan:
    name: Image Security Scan
    runs-on: ubuntu-latest
    needs:
      - validate-release-input
      - build-image

    steps:
      - name: Download built image artifact
        uses: actions/download-artifact@v4
        with:
          name: store-front-image
          path: /tmp

      - name: Install Trivy
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

          trivy --version

      - name: Scan built image before push
        run: |
          set -euo pipefail

          trivy image \
            --input /tmp/store-front-image.tar \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 1

  push-image-to-acr:
    name: Push Image to ACR
    runs-on: ubuntu-latest
    needs:
      - validate-release-input
      - image-security-scan

    steps:
      - name: Download built image artifact
        uses: actions/download-artifact@v4
        with:
          name: store-front-image
          path: /tmp

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          set -euo pipefail
          az acr login --name "${{ vars.ACR_NAME }}"

      - name: Load and push scanned image
        run: |
          set -euo pipefail

          IMAGE_REF="${{ needs.validate-release-input.outputs.image_ref }}"

          docker load -i /tmp/store-front-image.tar

          echo "Pushing scanned image: ${IMAGE_REF}"
          docker push "${IMAGE_REF}"

      - name: Verify image tag in ACR
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ needs.validate-release-input.outputs.image_tag }}"

          az acr repository show-tags \
            --name "${{ vars.ACR_NAME }}" \
            --repository store-front \
            --output tsv | grep -Fx "${IMAGE_TAG}"

          echo "Image tag exists in ACR: ${IMAGE_TAG}"

  update-dev-gitops:
    name: Update Dev GitOps
    runs-on: ubuntu-latest
    needs:
      - validate-release-input
      - push-image-to-acr

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          ref: ${{ vars.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Update Dev image tag in GitOps repo
        working-directory: gitops
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ needs.validate-release-input.outputs.image_tag }}"
          IMAGE_REF="${{ needs.validate-release-input.outputs.image_ref }}"
          FILE="${{ vars.GITOPS_STORE_FRONT_FILE }}"

          echo "Updating ${FILE}"
          echo "New image ref: ${IMAGE_REF}"
          echo "New image tag: ${IMAGE_TAG}"

          if [[ ! -f "${FILE}" ]]; then
            echo "GitOps file not found: ${FILE}"
            exit 1
          fi

          if grep -q "newTag:" "${FILE}"; then
            sed -i -E "s#newTag: .*#newTag: ${IMAGE_TAG}#g" "${FILE}"

            echo "Updated kustomize image tag:"
            grep -n "newTag:" "${FILE}"
          else
            sed -i -E "s#image: .*/store-front:.*#image: ${IMAGE_REF}#g" "${FILE}"

            echo "Updated direct image line:"
            grep -n "image: .*store-front" "${FILE}"
          fi

      - name: Commit and push GitOps change
        working-directory: gitops
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ needs.validate-release-input.outputs.image_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No GitOps changes to commit. Dev already uses ${IMAGE_TAG}."
            exit 0
          fi

          git add "${{ vars.GITOPS_STORE_FRONT_FILE }}"
          git commit -m "Deploy store-front ${IMAGE_TAG} to dev"
          git push origin "${{ vars.GITOPS_BRANCH }}"

  build-and-dev-update-summary:
    name: Build and Dev Update Summary
    runs-on: ubuntu-latest
    needs:
      - validate-release-input
      - secret-scan
      - source-security-scan
      - build-image
      - image-security-scan
      - push-image-to-acr
      - update-dev-gitops
    if: always()

    steps:
      - name: Write build and Dev update summary
        run: |
          {
            echo "# Store-front Dev Release Summary"
            echo
            echo "| Gate | Result | Purpose |"
            echo "|---|---|---|"
            echo "| Validate Release Input | ${{ needs.validate-release-input.result }} | Validates image tag and builds expected image reference |"
            echo "| Secret Scan | ${{ needs.secret-scan.result }} | Scans repository for accidental secrets using Gitleaks |"
            echo "| Source Security Scan | ${{ needs.source-security-scan.result }} | Scans store-front source/dependencies using Trivy |"
            echo "| Build Image | ${{ needs.build-image.result }} | Builds the image locally without pushing it to ACR |"
            echo "| Image Security Scan | ${{ needs.image-security-scan.result }} | Scans the built image before it is pushed |"
            echo "| Push Image to ACR | ${{ needs.push-image-to-acr.result }} | Pushes only the scanned image to ACR |"
            echo "| Update Dev GitOps | ${{ needs.update-dev-gitops.result }} | Updates Dev GitOps desired state with the image tag |"
            echo
            echo "Image: ${{ needs.validate-release-input.outputs.image_ref }}"
            echo
            echo "Security flow:"
            echo
            echo "1. Build image locally."
            echo "2. Scan image before registry push."
            echo "3. Push image to ACR only if scan passes."
            echo "4. Update GitOps only after image exists in ACR."
            echo
            echo "Next expected actions:"
            echo
            echo "1. GitOps validation workflow runs in the GitOps repo if a new GitOps commit was pushed."
            echo "2. Argo CD syncs capstone-store-dev."
            echo "3. Run the Dev release verification workflow."
          } >> "$GITHUB_STEP_SUMMARY"
